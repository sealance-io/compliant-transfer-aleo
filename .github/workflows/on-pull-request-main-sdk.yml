name: SDK Tests

on:
  pull_request:
    branches:
      - main

# No default permissions - jobs must explicitly request what they need
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Review dependency changes for vulnerabilities and license compliance
  # Runs independently - only analyzes dependency diff, not full codebase
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # Required for comment-summary-in-pr
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          config-file: ./.github/dependency-review-config.yml

  # Detect if SDK code changed (skip for non-SDK or docs-only changes)
  # NOTE: This replaces workflow-level `paths` filter. Equivalent to:
  #   paths:
  #     - "packages/policy-engine-sdk/**"
  #     - "scripts/peer-floor-smoke.mjs"
  #     - "!packages/policy-engine-sdk/**/*.md"
  #     - "!packages/policy-engine-sdk/examples/**"
  # Workflow-level path filters cause required status checks to remain "Pending"
  # forever when skipped, blocking PR merges. Job-level skipping via `if:` reports
  # "Success" for skipped jobs, allowing the SDK Status rollup to pass.
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sdk: ${{ steps.filter.outputs.sdk }}
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for SDK code changes
        id: filter
        run: |
          git fetch origin "$BASE_REF" --depth=1 2>/dev/null || true
          CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD" 2>/dev/null || echo "")

          # Filter to SDK files, excluding .md and examples. The peer floor
          # guard lives outside the workspace, so match it explicitly - edits to
          # the guard itself must run the job they guard.
          SDK_CHANGES=$(echo "$CHANGED" | grep -E '^(packages/policy-engine-sdk/|scripts/peer-floor-smoke\.mjs$)' | grep -vE '\.md$' | grep -v '^packages/policy-engine-sdk/examples/' || echo "")

          if [[ -n "$SDK_CHANGES" ]]; then
            echo "sdk=true" >> "$GITHUB_OUTPUT"
            echo "SDK code changes detected:"
            echo "$SDK_CHANGES"
          else
            echo "sdk=false" >> "$GITHUB_OUTPUT"
            echo "No SDK code changes"
          fi
        env:
          BASE_REF: ${{ github.base_ref }}

  linter:
    needs: detect-changes
    if: needs.detect-changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          cache: "npm"
          node-version-file: ".nvmrc"

      # Validate lockfile BEFORE npm ci (committed script, zero network deps)
      - name: Validate lockfile
        run: node scripts/validate-lockfile.mjs

      - name: Install dependencies
        run: npm ci --prefer-offline --ignore-scripts --allow-git=none --no-audit --no-fund

      - name: Run prettier
        run: npm run format --workspace=@sealance-io/policy-engine-aleo

  test:
    needs: [dependency-review, detect-changes, linter]
    if: needs.detect-changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          cache: "npm"
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci --prefer-offline --ignore-scripts --allow-git=none --no-audit --no-fund

      - name: Build SDK
        run: npm run build --workspace=@sealance-io/policy-engine-aleo

      - name: Run tests with coverage
        run: npm run test:coverage --workspace=@sealance-io/policy-engine-aleo

  # The SDK's peerDependencies range spans two @provablehq/sdk minor lines, but
  # the workspace only ever installs the upper one (root pins it exactly), so
  # the lower bound is an unverified promise to consumers. Install the packed
  # tarball against the floor in a throwaway project - the way a consumer would
  # - and confirm Merkle roots are unchanged. A forced install inside the
  # workspace is not an option here: the root pin makes npm refuse the
  # resolution without --force, which would prove nothing.
  test-peer-floor:
    needs: [dependency-review, detect-changes, linter]
    if: needs.detect-changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          cache: "npm"
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci --prefer-offline --ignore-scripts --allow-git=none --no-audit --no-fund

      - name: Build SDK
        run: npm run build --workspace=@sealance-io/policy-engine-aleo

      # Derived rather than hardcoded so narrowing the range retargets the job
      # instead of silently testing a version nobody supports anymore.
      - name: Resolve peer range floor
        id: floor
        run: |
          FLOOR=$(node -p "require('./packages/policy-engine-sdk/package.json').peerDependencies['@provablehq/sdk'].split('||')[0].trim().replace(/^[^0-9]*/, '')")
          if [[ -z "$FLOOR" ]]; then
            echo "::error::Could not parse the @provablehq/sdk peer range floor"
            exit 1
          fi
          echo "Peer range floor: $FLOOR"
          echo "floor=$FLOOR" >> "$GITHUB_OUTPUT"

      - name: Pack SDK and install against the floor
        run: |
          npm pack --workspace=@sealance-io/policy-engine-aleo --ignore-scripts --pack-destination "$RUNNER_TEMP"
          TARBALL=$(ls "$RUNNER_TEMP"/sealance-io-policy-engine-aleo-*.tgz)
          mkdir -p "$RUNNER_TEMP/peer-floor"
          cd "$RUNNER_TEMP/peer-floor"
          npm init -y > /dev/null
          npm pkg set type=module > /dev/null
          npm install --ignore-scripts --no-audit --no-fund "$TARBALL" "@provablehq/sdk@$PEER_FLOOR"
        env:
          PEER_FLOOR: ${{ steps.floor.outputs.floor }}

      - name: Verify Merkle roots against the floor
        run: |
          cp scripts/peer-floor-smoke.mjs "$RUNNER_TEMP/peer-floor/"
          cd "$RUNNER_TEMP/peer-floor"
          node peer-floor-smoke.mjs
        env:
          PEER_FLOOR: ${{ steps.floor.outputs.floor }}

  # Rollup job: Stable check name for branch protection
  sdk-status:
    name: SDK Status
    needs: [dependency-review, detect-changes, linter, test, test-peer-floor]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {} # No permissions needed - just checks job results
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - name: Check results
        run: |
          echo "::group::Job Results"
          echo "Dependency review: $DEP_REVIEW_RESULT"
          echo "SDK changes: $SDK_CHANGES"
          echo "Linter: $LINTER_RESULT"
          echo "Test: $TEST_RESULT"
          echo "Peer floor test: $PEER_FLOOR_RESULT"
          echo "::endgroup::"

          # Dependency review must always pass (runs on all PRs)
          if [[ "$DEP_REVIEW_RESULT" != "success" ]]; then
            echo "::error::Dependency review failed - check for vulnerabilities or license issues"
            exit 1
          fi

          # No SDK changes - all skipped is OK
          if [[ "$SDK_CHANGES" != "true" ]]; then
            echo "::notice::No SDK code changes - skipped checks"
            exit 0
          fi

          # SDK changed - verify jobs passed
          if [[ "$LINTER_RESULT" != "success" ]]; then
            echo "::error::Linter failed"
            exit 1
          fi

          if [[ "$TEST_RESULT" != "success" ]]; then
            echo "::error::SDK tests failed"
            exit 1
          fi

          if [[ "$PEER_FLOOR_RESULT" != "success" ]]; then
            echo "::error::Peer floor test failed - the declared @provablehq/sdk peer range is not supported"
            exit 1
          fi

          echo "::notice::All SDK checks passed"
        env:
          DEP_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          SDK_CHANGES: ${{ needs.detect-changes.outputs.sdk }}
          LINTER_RESULT: ${{ needs.linter.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PEER_FLOOR_RESULT: ${{ needs.test-peer-floor.result }}
